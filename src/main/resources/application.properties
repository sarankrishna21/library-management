# Library Management System - Spring Boot Configuration
server.port=8080

# Application name
spring.application.name=library-management

# Disable Spring Boot banner (optional - cleaner logs)
spring.main.banner-mode=console

# Jackson: serialize fields with their exact names (camelCase)
spring.jackson.default-property-inclusion=non_null

# Logging: suppress noisy HBase/Hadoop/ZooKeeper logs, keep Spring startup info
logging.level.root=WARN
logging.level.com.library=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
